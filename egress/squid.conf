# Allowlist-only forward proxy for the containercomp desktop.
# ccu writes /etc/squid/allowlist.txt (one squid dstdomain per line:
# "host.example.com" matches exactly, ".example.com" matches the domain and
# every subdomain) and runs `squid -k reconfigure` to apply changes.

http_port 3128

# -n: never reverse-resolve IP-literal requests, so http://1.2.3.4/ can't pass
# by pointing that IP's PTR record at an allowlisted name.
acl allowlist dstdomain -n "/etc/squid/allowlist.txt"

# Order matters: deny anything off the list first, before any rule that needs
# DNS, so squid never resolves (and leaks to DNS) names it is about to block.
http_access deny !allowlist
http_access deny manager
http_access deny to_localhost
http_access allow allowlist
http_access deny all

# Plain forwarding: no cache, no identifying headers.
cache deny all
via off
forwarded_for delete

# One line per request; `ccu egress log` reads this file.
logformat ccu %tl %>a %Ss/%03>Hs %rm %ru
access_log stdio:/var/log/squid/access.log logformat=ccu
cache_log /var/log/squid/cache.log
logfile_rotate 0
pid_filename /run/squid/squid.pid
coredump_dir /var/cache/squid
shutdown_lifetime 1 seconds
