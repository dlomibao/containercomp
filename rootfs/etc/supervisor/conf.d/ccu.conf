[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -nolisten tcp -ac +extension RANDR
user=user
priority=10
autorestart=true
stdout_logfile=/var/log/ccu/xvfb.log
redirect_stderr=true

[program:desktop]
command=/opt/ccu/bin/start-desktop
user=user
environment=HOME="/home/user",USER="user",LOGNAME="user"
priority=20
autorestart=true
stdout_logfile=/var/log/ccu/desktop.log
redirect_stderr=true

[program:x11vnc]
command=/bin/bash -c '/opt/ccu/bin/wait-x && exec /usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -shared -localhost -rfbport 5900 -noxdamage -quiet $X11VNC_AUTH'
user=user
priority=30
autorestart=true
stdout_logfile=/var/log/ccu/x11vnc.log
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
user=user
priority=40
autorestart=true
stdout_logfile=/var/log/ccu/novnc.log
redirect_stderr=true
